{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}无权限 - 智慧校园管理平台{% endblock %}
{% block content %}
<div style="max-width:460px;margin:64px auto 0;text-align:center;">
    <div class="card" style="padding:40px;">
        <div class="stat-ic ic-red" style="width:54px;height:54px;border-radius:15px;margin:0 auto 16px;">{{ icon('shield', 26) }}</div>
        <h1 style="font-size:19px;font-weight:600;">无权访问</h1>
        <p style="color:var(--text-2);font-size:13.5px;margin-top:8px;">
            当前角色{{ '（' + role_label + '）' if role_label else '' }}没有此页面的访问权限。
        </p>
        <a class="btn" href="/" style="margin-top:20px;">返回工作台</a>
    </div>
</div>
{% endblock %}
