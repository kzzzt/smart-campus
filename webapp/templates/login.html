{% extends "base.html" %}
{% block title %}管理登录 - 智慧校园管理平台{% endblock %}
{% block content %}
<div style="max-width:380px;margin:60px auto 0;">
    <div class="card" style="padding:32px;">
        <div style="text-align:center;margin-bottom:24px;">
            <div style="width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:0 auto 12px;">校</div>
            <h1 style="font-size:18px;font-weight:600;">智慧校园管理平台</h1>
            <p style="color:var(--text-2);font-size:13px;margin-top:4px;">管理员登录</p>
        </div>
        {% if error %}
        <div style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;">管理员账号</label>
                <input type="text" name="username" value="{{ request.form.get('username','') }}" autocomplete="username" placeholder="admin" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;">密码</label>
                <input type="password" name="password" autocomplete="current-password" placeholder="admin123" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;">
            </div>
            <button type="submit" class="btn btn-block" style="padding:11px;">登 录</button>
        </form>
        <p style="text-align:center;font-size:12px;color:var(--text-3);margin-top:16px;">演示账号 admin / admin123（可通过环境变量 ADMIN_PASSWORD 修改）</p>
        <a href="/" style="display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--primary);">← 返回工作台</a>
    </div>
</div>
{% endblock %}
