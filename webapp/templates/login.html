<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智慧校园管理与安全平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f4f8; color: #1a2b3c; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #fff; border-radius: 14px; box-shadow: 0 8px 32px rgba(15,23,42,.12); padding: 40px; width: 360px; }
        h1 { font-size: 20px; color: #1f6feb; margin-bottom: 24px; text-align: center; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; color: #475569; margin-bottom: 6px; }
        .field input { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .field input:focus { outline: none; border-color: #1f6feb; }
        .btn { width: 100%; background: #1f6feb; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .btn:hover { background: #1a5fd0; }
        .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .hint { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 16px; }
        .back { display:block; text-align:center; margin-top:14px; font-size:13px; color:#1f6feb; text-decoration:none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 智慧校园管理与安全平台</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/login">
            <div class="field">
                <label>管理员账号</label>
                <input type="text" name="username" value="{{ request.form.get('username','') }}" autocomplete="username" placeholder="admin">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" name="password" autocomplete="current-password" placeholder="admin123">
            </div>
            <button type="submit" class="btn">登 录</button>
        </form>
        <div class="hint">演示账号：admin / admin123（可通过环境变量 ADMIN_PASSWORD 修改）</div>
        <a class="back" href="/">← 返回首页</a>
    </div>
</body>
</html>
