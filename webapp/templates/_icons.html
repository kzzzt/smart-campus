{# 内联 SVG 图标库（线性风格，随 currentColor 着色，离线可用） #}
{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'dashboard' -%}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {%- elif name == 'chat' -%}
  <path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 9 9 0 0 1-3.7-.8L3 20.5l1.2-4.7A8.2 8.2 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.2a8.4 8.4 0 0 1 9 8.3z"/>
  {%- elif name == 'bolt' -%}
  <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>
  {%- elif name == 'calendar' -%}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>
  {%- elif name == 'bell' -%}
  <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
  {%- elif name == 'logout' -%}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
  {%- elif name == 'user' -%}
  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  {%- elif name == 'ticket' -%}
  <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9.5h10M7 13.5h6"/>
  {%- elif name == 'check' -%}
  <path d="M20 6 9 17l-5-5"/>
  {%- elif name == 'check-circle' -%}
  <circle cx="12" cy="12" r="9"/><path d="M8.5 12.5 11 15l4.5-5.5"/>
  {%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/>
  {%- elif name == 'alert' -%}
  <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
  <path d="M12 9v4.5M12 17.2h.01"/>
  {%- elif name == 'building' -%}
  <rect x="5" y="3" width="14" height="18" rx="1.5"/>
  <path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M9 15h1.5M13.5 15H15M10 21v-3h4v3"/>
  {%- elif name == 'refresh' -%}
  <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>
  {%- elif name == 'send' -%}
  <path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
  {%- elif name == 'shield' -%}
  <path d="M12 2 4 5.5v5.7c0 4.9 3.4 9.1 8 10.8 4.6-1.7 8-5.9 8-10.8V5.5L12 2z"/>
  {%- elif name == 'cap' -%}
  <path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12.5V17c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/>
  {%- elif name == 'book' -%}
  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>
  {%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/>
  {%- elif name == 'trend' -%}
  <path d="M22 7 13.5 15.5l-4-4L2 19"/><path d="M16 7h6v6"/>
  {%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
  {%- else -%}
  <circle cx="12" cy="12" r="8"/>
  {%- endif -%}
</svg>
{%- endmacro %}
